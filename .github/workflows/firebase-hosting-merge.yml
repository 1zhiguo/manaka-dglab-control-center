name: Deploy website to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Windows download mirror
        shell: bash
        run: |
          mkdir -p website/dist/downloads
          curl --fail --location --retry 3 \
            --output website/dist/downloads/ManakaQmlControlCenter-v0.24.4-win64-with-mods.zip \
            https://github.com/1zhiguo/manaka-dglab-control-center/releases/download/v0.24.4/ManakaQmlControlCenter-v0.24.4-win64-with-mods.zip
          echo "DD0C09DFDAE832C48A08012A3F6A697F82F681DA81C0A0EA6E874A7938A3922F  website/dist/downloads/ManakaQmlControlCenter-v0.24.4-win64-with-mods.zip" | sha256sum --check

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANAKA_DGLAB }}"
          channelId: live
          projectId: manaka-dglab
