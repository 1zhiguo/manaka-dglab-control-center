name: Deploy website to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Markdown documentation
        shell: bash
        run: |
          cp QUICKSTART_CN.md website/dist/QUICKSTART_CN.md
          cp FAQ_CN.md website/dist/FAQ_CN.md
          cp QUICKSTART_EN.md website/dist/QUICKSTART_EN.md
          cp FAQ_EN.md website/dist/FAQ_EN.md

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANAKA_DGLAB }}"
          channelId: live
          projectId: manaka-dglab
