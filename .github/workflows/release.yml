name: Publish prebuilt release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已经上传完整便携包的版本号（例如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  COS_BUCKET: manaka-dglab-downloads-1504229034
  COS_REGION: ap-shanghai
  FIREBASE_PROJECT_ID: manaka-dglab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release metadata
        id: release_meta
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$REQUESTED_VERSION" | xargs)"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          FILE_NAME="ManakaQmlControlCenter-${VERSION}-win64-with-mods.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download the already-published full package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          FILE_NAME: ${{ steps.release_meta.outputs.file_name }}
        run: |
          set -euo pipefail
          mkdir -p release-payload
          gh release download "$VERSION" \
            --pattern "$FILE_NAME" \
            --pattern "$FILE_NAME.sha256" \
            --dir release-payload

      - name: Verify package checksum and required Mod payload
        id: package
        shell: bash
        env:
          FILE_NAME: ${{ steps.release_meta.outputs.file_name }}
        run: |
          set -euo pipefail
          cd release-payload
          sha256sum --check --strict "$FILE_NAME.sha256"
          SHA256="$(sha256sum "$FILE_NAME" | awk '{print toupper($1)}')"
          for required in \
            ManakaQmlControlCenter/mod_repositories/custommissions1/ \
            ManakaQmlControlCenter/mod_repositories/custommissions2/ \
            ManakaQmlControlCenter/mod_repositories/plugins/; do
            if ! unzip -Z1 "$FILE_NAME" | grep -F "$required" >/dev/null; then
              echo "Missing required release payload: $required" >&2
              exit 1
            fi
          done
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Install Tencent COS SDK
        run: python -m pip install --disable-pip-version-check cos-python-sdk-v5==1.9.44

      - name: Upload and verify mainland mirror
        id: cos
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          FILE_NAME: ${{ steps.release_meta.outputs.file_name }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: >-
          python tools/upload_cos_release.py
          --file "release-payload/$FILE_NAME"
          --version "$VERSION"
          --bucket "$COS_BUCKET"
          --region "$COS_REGION"

      - name: Update website download manifest
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          FILE_NAME: ${{ steps.release_meta.outputs.file_name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          COS_URL: ${{ steps.cos.outputs.cos_url }}
        run: |
          set -euo pipefail
          GITHUB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${FILE_NAME}"
          python tools/write_download_config.py \
            --version "$VERSION" \
            --file-name "$FILE_NAME" \
            --sha256 "$SHA256" \
            --cos-url "$COS_URL" \
            --github-url "$GITHUB_URL" \
            --output website/dist/download-config.js
          cp QUICKSTART_CN.md website/dist/QUICKSTART_CN.md
          cp FAQ_CN.md website/dist/FAQ_CN.md
          cp QUICKSTART_EN.md website/dist/QUICKSTART_EN.md
          cp FAQ_EN.md website/dist/FAQ_EN.md

      - name: Commit release manifest
        shell: bash
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/dist/download-config.js
          if git diff --cached --quiet; then
            echo "Download manifest already matches $VERSION."
          else
            git commit -m "chore(release): update download manifest for $VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy website to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANAKA_DGLAB }}"
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
